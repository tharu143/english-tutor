<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI English Tutor</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
    }
  }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* CSS Variables for Theming */
    :root {
      --bg-primary: #f9fafb; /* gray-50 */
      --bg-secondary: #ffffff; /* white */
      --bg-tertiary: #f3f4f6; /* gray-100 */
      --bg-overlay: rgba(255, 255, 255, 0.8);

      --text-primary: #1f2937; /* gray-800 */
      --text-secondary: #6b7280; /* gray-500 */
      --text-tertiary: #9ca3af; /* gray-400 */
      --text-accent: #4f46e5; /* indigo-600 */
      --text-inverted: #ffffff; /* white */

      --border-primary: #e5e7eb; /* gray-200 */
      --border-secondary: #d1d5db; /* gray-300 */
      --border-accent: #4f46e5; /* indigo-600 */

      --accent-primary: #4f46e5; /* indigo-600 */
      --accent-primary-hover: #4338ca; /* indigo-700 */
      --accent-secondary: #818cf8; /* indigo-400 */

      --shadow-color: rgba(0, 0, 0, 0.1);
      --shadow-color-lg: rgba(0, 0, 0, 0.15);
    }

    [data-theme="dark"] {
      --bg-primary: #111827; /* gray-900 */
      --bg-secondary: #1f2937; /* gray-800 */
      --bg-tertiary: #374151; /* gray-700 */
      --bg-overlay: rgba(17, 24, 39, 0.8);
      
      --text-primary: #f9fafb; /* gray-50 */
      --text-secondary: #9ca3af; /* gray-400 */
      --text-tertiary: #6b7280; /* gray-500 */
      --text-accent: #818cf8; /* indigo-400 */
      --text-inverted: #ffffff; /* white */

      --border-primary: #374151; /* gray-700 */
      --border-secondary: #4b5563; /* gray-600 */
      --border-accent: #818cf8; /* indigo-400 */

      --accent-primary: #6366f1; /* indigo-500 */
      --accent-primary-hover: #4f46e5; /* indigo-600 */
      --accent-secondary: #a5b4fc; /* indigo-300 */

      --shadow-color: rgba(0, 0, 0, 0.3);
      --shadow-color-lg: rgba(0, 0, 0, 0.4);
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s, color 0.3s;
    }
    
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }

    /* Avatar Animations */
    @keyframes idle-float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    @keyframes subtle-nod {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes talk-mouth {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.8); }
    }
    @keyframes eyebrow-raise {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
